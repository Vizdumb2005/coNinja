name: PR Checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: codeweaver-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: ./codeweaver-dashboard
        run: npm ci

      - name: Lint code
        working-directory: ./codeweaver-dashboard
        run: npm run lint:all

      - name: Type check
        working-directory: ./codeweaver-dashboard
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: ./codeweaver-dashboard
        run: npm run test

      - name: Build verification
        working-directory: ./codeweaver-dashboard
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codeweaver-dashboard-preview
          path: codeweaver-dashboard/dist/
          retention-days: 7
